<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/assets/b-favicon.svg" type="image/svg+xml" />
  <title>BOOST - Forgot Password</title>
  <link rel="stylesheet" href="/css/style.css?v=17" />
</head>
<body>
  <main class="page">
    <div class="signin-shell">
      <div class="brand-panel">
        <img class="brand-logo" src="/assets/boost-logo-mark.png" alt="BOOST" />
        <p class="brand-tagline">Procurement and Order Operations System</p>
      </div>

      <div class="auth-card">
        <section class="signin-panel">
          <div class="signin-inner">
            <h1 class="signin-title">Forgot Password</h1>
            <p class="signin-subtitle">Enter your email and we will send you a reset link</p>

            <form id="forgot-form" novalidate>
              <div class="field">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  autocomplete="email"
                  placeholder="you@company.com"
                  required
                />
              </div>

              <p class="form-error" id="form-error" role="alert" hidden></p>
              <p class="form-note" id="form-note" role="status" hidden></p>

              <button type="submit" class="btn-signin" id="send-btn">Send reset link</button>
            </form>

            <p class="auth-alt">Remembered it? <a href="/login">Back to sign in</a></p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script defer src="/js/reset.js?v=1"></script>
</body>
</html>
