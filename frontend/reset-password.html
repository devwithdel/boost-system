<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/assets/b-favicon.svg" type="image/svg+xml" />
  <title>BOOST - Choose a New Password</title>
  <link rel="stylesheet" href="/css/style.css?v=17" />
</head>
<body>
  <main class="page">
    <div class="signin-shell">
      <div class="brand-panel">
        <img class="brand-logo" src="/assets/boost-logo-mark.png" alt="BOOST" />
        <p class="brand-tagline">Procurement and Order Operations System</p>
      </div>

      <div class="auth-card">
        <section class="signin-panel">
          <div class="signin-inner">
            <h1 class="signin-title">Choose a New Password</h1>
            <p class="signin-subtitle" id="reset-subtitle">Pick a password you have not used before</p>

            <form id="reset-form" novalidate hidden>
              <div class="field">
                <label for="password">New password</label>
                <div class="password-wrap">
                  <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    placeholder="••••••••"
                    required
                  />
                  <button type="button" class="toggle-visibility" id="toggle-password" aria-label="Show password">
                    <svg class="icon-eye" viewBox="0 0 24 24"><path d="M12 5c-7.633 0-11 6.5-11 7s3.367 7 11 7 11-6.5 11-7-3.367-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9z"/><circle cx="12" cy="12" r="2"/></svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" hidden><path d="M2 4.27 3.28 3 21 20.72 19.73 22l-3.08-3.08A11.6 11.6 0 0 1 12 20C4.367 20 1 13.5 1 13a13.6 13.6 0 0 1 4.06-5.44L2 4.27zM12 7.5a4.5 4.5 0 0 1 4.5 4.5c0 .59-.13 1.14-.35 1.64l1.47 1.47A6.98 6.98 0 0 0 19 12c0-.5-3.37-7-11-7-.94 0-1.8.09-2.6.26l1.72 1.72A4.5 4.5 0 0 1 12 7.5z"/></svg>
                  </button>
                </div>
              </div>

              <div class="field">
                <label for="confirm">Confirm new password</label>
                <input
                  type="password"
                  id="confirm"
                  name="confirm"
                  autocomplete="new-password"
                  placeholder="••••••••"
                  required
                />
              </div>

              <ul class="pw-rules">
                <li id="rule-length">At least 8 characters</li>
                <li id="rule-letter">Contains a letter</li>
                <li id="rule-number">Contains a number</li>
              </ul>

              <p class="form-error" id="form-error" role="alert" hidden></p>
              <p class="form-note" id="form-note" role="status" hidden></p>

              <button type="submit" class="btn-signin" id="reset-btn">Update password</button>
            </form>

            <p class="auth-alt"><a href="/forgot-password">Request a new reset link</a></p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script defer src="/js/reset.js?v=1"></script>
</body>
</html>
