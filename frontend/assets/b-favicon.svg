<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="BOOST">
  <!-- Rounded plate so the mark stays legible on both light and dark tabs. -->
  <rect width="64" height="64" rx="14" fill="#16233f"/>

  <!-- The B: one silhouette with two counters punched out (evenodd).
       Horizontal slots in the counters echo the ruled lines in the artwork. -->
  <path fill="#1e6fd9" fill-rule="evenodd" d="
    M13 10 h17
    c9 0 14.5 4.4 14.5 11.4
    c0 4.6 -2.5 7.9 -6.6 9.4
    c5.1 1.4 8.6 5 8.6 10.3
    c0 8.1 -6.4 12.6 -16.9 12.6
    H13 Z

    M22.6 18.2 v8.6 h5.9
    c4.6 0 6.9 -1.6 6.9 -4.4
    c0 -2.8 -2.3 -4.2 -6.9 -4.2 Z

    M22.6 35.4 v9.4 h6.7
    c5.1 0 7.7 -1.7 7.7 -4.8
    c0 -3.1 -2.6 -4.6 -7.7 -4.6 Z
  "/>

  <!-- Orange swoosh rising left to right, drawn over the B. -->
  <path d="M7 47 C 20 44 32 36 41.5 23.5"
        fill="none" stroke="#f58220" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Arrowhead on the rising end. -->
  <path d="M51 9 L38.5 21 L46.5 26.5 Z" fill="#f58220"/>
</svg>