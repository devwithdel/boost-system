<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOOST — Dashboard (placeholder)</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family: "Segoe UI", Arial, sans-serif; background:#0E1220; color:#E9ECF5; }
    .box { text-align:center; max-width:420px; padding:32px; }
    h1 { font-size:20px; margin-bottom:8px; }
    p { color:#A9B0C9; font-size:14px; line-height:1.5; }
    #whoami { margin-top:16px; font-size:13px; color:#8FA6FF; }
    a { color:#8FA6FF; }
  </style>
</head>
<body>
  <div class="box">
    <h1>You're signed in ✓</h1>
    <p>This is a placeholder — the real Dashboard module (Section 3 of the system hierarchy) hasn't been built yet.</p>
    <div id="whoami">Checking session…</div>
    <p><a href="/logout-test.html">Log out</a></p>
  </div>
  <script>
    fetch("/api/auth/me", { credentials: "include" })
      .then((r) => r.json())
      .then((data) => {
        const el = document.getElementById("whoami");
        if (data.user) {
          el.textContent = `Signed in as ${data.user.fullName} (${data.user.email}) — role: ${data.user.role}`;
        } else {
          el.textContent = "Not signed in.";
        }
      })
      .catch(() => {
        document.getElementById("whoami").textContent = "Could not verify session.";
      });
  </script>
</body>
</html>
